name: image

# The database's image (Containerfile), published for the installer to pull:
# ghcr.io/einhq/db:main is main as of the last build, :sha-<commit> each commit built. Built once a
# day when main has moved since (ein/core#835), and at once when run by hand. The base is a floating
# tag, so Monday's run builds whatever the commit, taking PostgreSQL's and the extensions' minor
# releases into :main too.
on:
  schedule:
    - cron: '17 3 * * 0,2-6'
    - cron: '17 3 * * 1'
  workflow_dispatch:

# One build at a time; a run started during it waits, and only the newest waiting run is kept.
concurrency:
  group: image
  cancel-in-progress: false

jobs:
  # Whether to build: a scheduled run other than Monday's builds nothing when main's commit already
  # has its image.
  check:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/db
          WEEKLY: ${{ github.event.schedule == '17 3 * * 1' }}
        run: |
          sha=$(git rev-parse --short=9 HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$WEEKLY" != true ] &&
            docker manifest inspect "$IMAGE:sha-$sha" >/dev/null 2>&1; then
            echo "$IMAGE:sha-$sha exists"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/db:main
            ghcr.io/${{ github.repository_owner }}/db:sha-${{ needs.check.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=PostgreSQL for EiN, with TimescaleDB, pgvector and PostGIS: run by compose from ein/deploy
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
